<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f1f3f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a1020" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // Applique le thème choisi (src/lib/theme.ts) avant le premier rendu pour éviter le flash.
      (function () {
        try {
          var t = localStorage.getItem('cockpit-theme');
          if (t !== 'light' && t !== 'dark') return;
          var r = document.documentElement;
          r.setAttribute('data-theme', t);
          r.style.colorScheme = t;
          var c = t === 'dark' ? '#0a1020' : '#f1f3f6';
          var m = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < m.length; i++) { m[i].setAttribute('data-original', m[i].content); m[i].content = c; }
        } catch (e) { /* stockage indisponible : on suit le système */ }
      })();
    </script>
    <title>Cockpit</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%235048e5'/><circle cx='23' cy='9' r='3.4' fill='%23ffc94d'/><path d='M3 25 L12.5 9.5 L18 18.5 L21 14 L29 25 Z' fill='white'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@900&text=Cockpit&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
