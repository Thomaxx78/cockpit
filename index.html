<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e6e9ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#070b16" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // Applique le thème choisi (src/lib/theme.ts) avant le premier rendu pour éviter le flash.
      (function () {
        try {
          var t = localStorage.getItem('cockpit-theme');
          if (t !== 'light' && t !== 'dark') return;
          var r = document.documentElement;
          r.setAttribute('data-theme', t);
          r.style.colorScheme = t;
          var c = t === 'dark' ? '#070b16' : '#e6e9ee';
          var m = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < m.length; i++) { m[i].setAttribute('data-original', m[i].content); m[i].content = c; }
        } catch (e) { /* stockage indisponible : on suit le système */ }
      })();
    </script>
    <title>Cockpit</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='23' cy='9' r='3.4' fill='%23ffc94d'/><path d='M3 25 L12.5 9.5 L18 18.5 L21 14 L29 25 Z' fill='%235048e5'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Bricolage Grotesque : nom « Cockpit » et titres (police variable, graisses 300 à 800) -->
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      /* Écran de démarrage, affiché avant le chargement du JavaScript ; repris tel quel par
         <Splash /> (src/components/Logo.tsx) pour un passage invisible. Fond = --bg du thème. */
      html { background: #e6e9ee; }
      :root[data-theme="dark"] { background: #070b16; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { background: #070b16; } }
      .boot { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; color: #5048e5; }
      .boot svg { animation: boot-breathe 1.4s ease-in-out infinite alternate; }
      @keyframes boot-breathe { from { opacity: .6; transform: scale(.96); } }
      @media (prefers-reduced-motion: reduce) { .boot svg { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" aria-hidden="true"><svg width="72" height="72" viewBox="0 0 32 32"><path d="M3 25 L12.5 9.5 L18 18.5 L21 14 L29 25 Z" fill="currentColor"/><path d="M12.5 9.5 L18 18.5 L16.4 25 L13.8 25 Z" fill="#000" opacity=".16"/></svg></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
